name: Sync FAQ knowledge base

# Keeps the FAQ's HydraDB database (repo variable HYDRADB_FAQ_DATABASE) in
# sync with the docs (v2 Guides tab), the public website (hydradb.com), and
# the hand-written Q&A list in faq/qa.yaml. The FAQ box on hydradb.com answers
# visitors from that database. See scripts/sync_faq.py for the full behaviour
# and PRO-2899 / PRO-2776 for context.

on:
  push:
    branches: [main]
    paths:
      # Guides content drives the docs sources.
      - 'docs.json'
      - 'get-started/v2/**'
      - 'essentials/v2/**'
      - 'plugins/**'
      - 'AGENTS.mdx'
      # The hand-written Q&A list.
      - 'faq/**'
      # The sync itself.
      - 'scripts/sync_faq.py'
      - '.github/workflows/sync-faq.yml'
  # Website changes (Framer) are not in this repo; re-sync weekly.
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A push and the weekly run must not ingest and clean up at the same time.
concurrency:
  group: sync-faq
  cancel-in-progress: false

jobs:
  sync:
    name: Sync FAQ database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --no-input pyyaml

      - name: Sync FAQ knowledge base
        env:
          HYDRADB_FAQ_API_KEY: ${{ secrets.HYDRADB_FAQ_API_KEY }}
          HYDRADB_FAQ_DATABASE: ${{ vars.HYDRADB_FAQ_DATABASE }}
        run: python scripts/sync_faq.py
