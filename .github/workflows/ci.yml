name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Kept in step with mise.toml and .node-version so contributors and CI
          # validate the docs under one runtime. mintlify refuses to run on
          # Node 25+, so this pin is load-bearing, not cosmetic.
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Test retrieval quality evaluator
        run: node --test scripts/retrieval-quality-eval.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the public V2 contract
        run: |
          python -m pip install jsonschema==4.25.1
          python .github/verify_v2_public_contract.py
          python -m unittest discover -s .github -p 'test_v2_schema_types.py'

      - name: Validate documentation
        run: pnpm mintlify validate

  faq-sync-tests:
    name: faq-sync-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the FAQ sync
        run: python -m unittest discover -s scripts -p 'test_sync*.py'

  dco-check:
    name: dco-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Checking commits ${BASE_SHA}..${HEAD_SHA} for DCO sign-off..."
          MISSING=""
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by: '; then
              MISSING="$MISSING $sha"
              echo "FAIL: $(git log -1 --format='%h %s' $sha)"
            else
              echo "  OK: $(git log -1 --format='%h %s' $sha)"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo ""
            echo "The commits above are missing a DCO sign-off."
            echo "Fix with:  git rebase HEAD~N --signoff  (where N = number of commits)"
            exit 1
          fi
          echo "All commits have DCO sign-off."
