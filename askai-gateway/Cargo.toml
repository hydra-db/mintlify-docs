[package]
name = "askai-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Self-hosted Ask-AI answer gateway for HydraDB: retrieval-grounded, streamed, cited answers for docs widgets."
readme = "README.md"
publish = false

[dependencies]
axum = "0.8"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
