name: "Bug Report"
description: "Report a documentation issue or inaccuracy"
labels: ["bug"]
body:
  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: "The URL of the documentation page with the issue"
      placeholder: "https://docs.hydradb.com/quickstart"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "A clear description of the issue"
    validations:
      required: true

  - type: textarea
    id: expected-content
    attributes:
      label: Expected Content
      description: "What the documentation should say"
    validations:
      required: true

  - type: textarea
    id: actual-content
    attributes:
      label: Actual Content
      description: "What the documentation currently says"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: "Browser used when viewing the documentation"
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
    validations:
      required: false
