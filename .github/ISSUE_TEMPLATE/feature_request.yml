name: "Documentation Request"
description: "Request new documentation, guides, or API reference sections"
labels: ["enhancement"]
body:
  - type: textarea
    id: topic
    attributes:
      label: Topic or Feature
      description: "What topic or feature needs documentation?"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: "Why would this documentation be valuable? Who would benefit?"
    validations:
      required: true

  - type: textarea
    id: proposed-content
    attributes:
      label: Proposed Content
      description: "Describe what the documentation should cover, or provide an outline"
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: "Any reference material, links, or examples that would help"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
    validations:
      required: false
