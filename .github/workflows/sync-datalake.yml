name: Sync data lake

# Keeps the public docs in the team's internal knowledge data lake
# (internal-knowledge-data-lake / common-collection) so internal tools and the
# Hydra MCP can search them next to the internal wiki, Slack and Linear.
# This is NOT the website FAQ database: that is sync-faq.yml, with its own
# secret and database. See scripts/sync_datalake.py for the full behaviour.

on:
  push:
    branches: [main]
    paths:
      - '**/*.mdx'
      - '**/*.md'
      - 'docs.json'
      - 'api-reference/v2/openapi.json'
      - 'scripts/sync_datalake.py'
      - 'scripts/test_sync_datalake.py'
      - 'scripts/sync_faq.py'
      - 'scripts/datalake_taxonomy.json'
      - '.github/workflows/sync-datalake.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-datalake
  cancel-in-progress: false

jobs:
  sync:
    name: Sync data lake
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: deltas diff against the previous main, and each page's
          # tickets metadata comes from the PRO-xxxx ids in its commit messages.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test sync
        run: python -m unittest discover -s scripts -p 'test_sync*.py'

      - name: Sync to the data lake
        env:
          HYDRADB_DATALAKE_API_KEY: ${{ secrets.HYDRADB_DATALAKE_API_KEY }}
          HYDRADB_DATALAKE_DATABASE: ${{ vars.HYDRADB_DATALAKE_DATABASE }}
          HYDRADB_DATALAKE_COLLECTION: ${{ vars.HYDRADB_DATALAKE_COLLECTION }}
        run: python scripts/sync_datalake.py --full
