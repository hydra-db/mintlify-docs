[project]
docs_dir = "."
nav_file = "docs.json"
include = ["**/*.mdx"]
exclude = [
  "continuity-assurance.mdx",
  "archive/**",
  "snippets/**",
  # Per-integration setup guides, intentionally absent from the sidebar: the
  # Plugins page's cards link each one in both documentation versions.
  "plugins/claude-code.mdx",
  "plugins/hermes.mdx",
  "plugins/codex.mdx",
  "plugins/cursor.mdx",
  "plugins/crewai.mdx",
  "plugins/deepseek.mdx",
  "plugins/grok-build.mdx",
  "plugins/langchain.mdx",
  "plugins/muse-code.mdx",
  "plugins/opencode.mdx",
  "plugins/openclaw.mdx",
  # Connector endpoint pages kept out of the sidebar on purpose: the Connectors
  # overview links each one, and the setup flow stays short in the nav.
  "api-reference/endpoint/get-connector.mdx",
  "api-reference/endpoint/sync-connector.mdx",
  "api-reference/endpoint/delete-connector.mdx",
  "api-reference/endpoint/connector-resources.mdx",
  "api-reference/endpoint/add-connector-resource.mdx",
  "api-reference/endpoint/delete-connector-resource.mdx",
  "api-reference/endpoint/pause-connector.mdx",
  "api-reference/endpoint/resume-connector.mdx",
]
mdx_parse_mode = "strict"

[rules.unescaped_lt]
enabled = true
level = "error"

[rules.frontmatter_yaml]
enabled = true
level = "error"

[rules.filename_chars]
enabled = true
level = "error"

[rules.nav_registration]
enabled = true
level = "error"

[rules.prose_em_dash]
enabled = true
level = "warn"
