[project]
docs_dir = "."
nav_file = "docs.json"
include = ["**/*.mdx"]
exclude = [
  "archive/**",
  "snippets/**",
  # Connector endpoint pages kept out of the sidebar on purpose: the Connectors
  # overview links each one, and the setup flow stays short in the nav.
  "api-reference/v2/endpoint/get-connector.mdx",
  "api-reference/v2/endpoint/sync-connector.mdx",
  "api-reference/v2/endpoint/delete-connector.mdx",
  "api-reference/v2/endpoint/connector-resources.mdx",
  "api-reference/v2/endpoint/add-connector-resource.mdx",
  "api-reference/v2/endpoint/delete-connector-resource.mdx",
  "api-reference/v2/endpoint/pause-connector.mdx",
  "api-reference/v2/endpoint/resume-connector.mdx",
]
mdx_parse_mode = "strict"

[rules.unescaped_lt]
enabled = true
level = "error"

[rules.frontmatter_yaml]
enabled = true
level = "error"

[rules.filename_chars]
enabled = true
level = "error"

[rules.nav_registration]
enabled = true
level = "error"

[rules.prose_em_dash]
enabled = true
level = "warn"
