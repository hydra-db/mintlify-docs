# Hand-written Q&A list for the website FAQ.
#
# Ingested into the HydraDB database named by the HYDRADB_FAQ_DATABASE repo
# variable by `.github/workflows/sync-faq.yml` (one `knowledge_base` app
# source per entry, with provider `faq`). The live FAQ box at hydradb.com
# writes its answers from that database, so every answer here becomes
# public-facing.
#
# Rules:
#   - Only add real, reviewed Q&A pairs. Do NOT invent answers.
#   - Keep answers self-contained; the FAQ box links `url` (https only) as a
#     source.
#   - One entry per question. The item id is derived from the question text
#     (slugified, with a short hash suffix for uniqueness), not its position.
#
# Entry shape:
#   - question: <string, required>
#     answer: <string, required>
#     url: <string, optional>  # link to a page with more detail
#
# Example (do not ship invented answers; this is a shape reference only):
#   - question: How does HydraDB store my data?
#     answer: |
#       HydraDB stores your data in your isolated database. Documents and app
#       sources are chunked, embedded, and indexed alongside a knowledge graph
#       that captures the links between items.
#     url: https://docs.hydradb.com/essentials/v2/knowledge
items:
  # Pricing, copied from dashboard-2.0 next-app/src/config/upgradePlans.ts.
  # Update these when that file changes.
  - question: How much does HydraDB cost?
    answer: |
      HydraDB pricing has three hosted plans:
      - Ship: $25/month minimum usage. Storage costs $0.50 per GB-month.
      - Scale: $300/month minimum usage. Storage costs $0.25 per GB-month.
      - Enterprise: custom pricing. Contact sales at https://hydradb.com/contact.
      Ship and Scale charge the monthly minimum plus usage above it. Building
      graphs with the ontology engine costs $5 per 1M tokens ingested.
      HydraDB is also open source, so you can self-host it for free.
    url: https://hydradb.com/#pricing
  - question: Is there a free plan?
    answer: |
      The hosted Free plan was retired on 2 October 2026. HydraDB is open
      source, so you can self-host it for free:
      https://github.com/hydra-db/hydradb
    url: https://github.com/hydra-db/hydradb
  - question: What is the difference between the Ship, Scale and Enterprise plans?
    answer: |
      Ship ($25/month minimum usage) runs in production on HydraDB Cloud: fully
      managed by HydraDB, storage at $0.50/GB-month, 100+ app connectors, and
      advanced logs and monitoring.
      Scale ($300/month minimum usage) is for fast-growing products that need
      dedicated infrastructure. It has everything in Ship, plus dedicated
      infrastructure for production workloads, storage at $0.25/GB-month, an
      uptime SLA, a private Slack channel, and SOC 2 and GDPR.
      Enterprise (custom pricing) is deployment and support tailored to your
      organization: deploy in your cloud or a dedicated cloud HydraDB manages,
      a dedicated forward-deployed engineer, a 99% uptime SLA, and a HIPAA BAA.
      Ship and Scale both charge $5 per 1M tokens ingested to build graphs with
      the ontology engine.
    url: https://hydradb.com/#pricing
