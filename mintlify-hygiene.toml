# mintlify-hygiene.toml
# Configuration for mintlify-hygiene linting.
# See: https://github.com/usecortex/mintlify-hygiene/blob/main/mintlify-hygiene.sample.toml

# ── Project settings ────────────────────────────────────────────────────────

[project]

# Docs live at the repository root (no docs/ subdirectory).
docs_dir = "."

# Navigation file at the repository root.
nav_file = "docs.json"

# Exclude the archive folder from all checks.
exclude = ["archive/**"]

# How to handle MDX parse failures: "loose" emits a warning, "strict" emits an error.
mdx_parse_mode = "loose"

# ── Rules ───────────────────────────────────────────────────────────────────

# Raw `<` before a letter or digit outside fenced code blocks.
[rules.unescaped_lt]
enabled = true
level   = "error"

# YAML frontmatter that fails to parse.
[rules.frontmatter_yaml]
enabled = true
level   = "error"

# Special characters in filenames that break Mintlify routing.
[rules.filename_chars]
enabled = true
level   = "error"

# Pages that exist on disk but are not listed in the navigation file (docs.json).
[rules.nav_registration]
enabled = true
level   = "error"

# Unicode em dash (U+2014) in prose text (common in AI-generated content).
[rules.prose_em_dash]
enabled = true
level   = "warn"
